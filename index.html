<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">

  <title>學校公務財產與物品智慧管理系統</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    :root {
      --primary-color: #0d6efd;
      --bg-surface: #f8f9fa;
    }
    body {
      background-color: var(--bg-surface);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding-bottom: 70px;
    }
    .badge-status-in_use { background-color: #198754; color: white; }
    .badge-status-pending_scrap { background-color: #ffc107; color: black; }
    .badge-status-scrapped { background-color: #dc3545; color: white; }
    
    .scanner-container {
      position: relative;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      max-height: 400px;
    }
    #reader {
      width: 100%;
    }
    .scan-aim-box {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 82%;
      height: 95px;
      border: 2px dashed #00ff66;
      border-radius: 8px;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.45);
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .scan-aim-line {
      width: 92%;
      height: 2px;
      background-color: #ff3b30;
      box-shadow: 0 0 8px #ff3b30;
      animation: scanAnim 1.8s infinite ease-in-out;
    }
    @keyframes scanAnim {
      0%, 100% { transform: translateY(-32px); }
      50% { transform: translateY(32px); }
    }
    .timeline {
      border-left: 2px solid #dee2e6;
      padding-left: 15px;
      margin-left: 5px;
    }
    .timeline-item {
      position: relative;
      margin-bottom: 12px;
    }
    .timeline-item::before {
      content: '';
      position: absolute;
      left: -21px;
      top: 4px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--primary-color);
    }
    .sticky-summary {
      position: sticky;
      top: 0;
      z-index: 1020;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(5px);
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);

<script>
/**
 * 1. 直接內建 Firebase 連線設定 (asset-3fb12)
 */
const firebaseConfig = {
  apiKey: "AIzaSyDRF9uirLpU2pIR2-rTMvSm4Fj_gemSoNo",
  authDomain: "asset-3fb12.firebaseapp.com",
  databaseURL: "https://asset-3fb12-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "asset-3fb12",
  storageBucket: "asset-3fb12.firebasestorage.app",
  messagingSenderId: "427140371493",
  appId: "1:427140371493:web:8008b2405dafed8daddbcc"
};

firebase.initializeApp(firebaseConfig);
const firebaseDb = firebase.database();

let db = null; // 本機 IndexedDB 快取備援
let assetsMap = new Map();
let locationsSet = new Set();
let html5QrCode = null;
let lastScannedCode = '';
let scanCooldownTimer = null;
let scanSuccessCount = 0;
let isTorchOn = false;

// 初始化本機 IndexedDB 快取
function initIndexedDB() {
  return new Promise((resolve) => {
    const request = indexedDB.open('SchoolAssetDB_Direct', 1);
    request.onupgradeneeded = (e) => {
      const idb = e.target.result;
      if (!idb.objectStoreNames.contains('assets')) {
        idb.createObjectStore('assets', { keyPath: 'assetKey' });
      }
    };
    request.onsuccess = (e) => {
      db = e.target.result;
      resolve(db);
    };
    request.onerror = () => resolve(null);
  });
}

function saveToIDB(asset) {
  if (!db) return;
  try {
    const tx = db.transaction('assets', 'readwrite');
    tx.objectStore('assets').put(asset);
  } catch (e) {}
}

// 啟動雲端即時同步與狀態監聽
async function initSystem() {
  await initIndexedDB();

  // 監聽連線狀態
  firebaseDb.ref('.info/connected').on('value', (snap) => {
    const badge = document.getElementById('cloudStatusBadge');
    if (snap.val() === true) {
      badge.className = 'badge bg-success text-white ms-2 fw-normal';
      badge.innerHTML = '<i class="bi bi-cloud-check-fill me-1"></i>雲端已同步';
    } else {
      badge.className = 'badge bg-warning text-dark ms-2 fw-normal';
      badge.innerHTML = '<i class="bi bi-cloud-slash me-1"></i>離線暫存中';
    }
  });

  // 監聽財產資料節點
  firebaseDb.ref('assets').on('value', (snapshot) => {
    const data = snapshot.val();
    assetsMap.clear();
    locationsSet.clear();
    if (data) {
      Object.keys(data).forEach(key => {
        const item = data[key];
        assetsMap.set(key, item);
        if (item.location) locationsSet.add(item.location);
        saveToIDB(item);
      });
    }
    updateLocationSelects();
    renderTable();
    updateStats();
  });
}

// 儲存單筆異動
function saveAsset(asset) {
  saveToIDB(asset);
  firebaseDb.ref('assets/' + asset.assetKey).set(asset);
}

// Excel 清冊匯入與智慧合併 (批次高速上傳)
function handleExcelUpload(e) {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = async (evt) => {
    try {
      const data = new Uint8Array(evt.target.result);
      const workbook = XLSX.read(data, { type: 'array' });
      const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
      const rawJson = XLSX.utils.sheet_to_json(firstSheet, { header: 1, defval: '' });

      let headerRowIdx = -1;
      for (let i = 0; i < Math.min(rawJson.length, 10); i++) {
        const rowStr = JSON.stringify(rawJson[i]);
        if (rowStr.includes('財產編號') || rowStr.includes('財產名稱')) {
          headerRowIdx = i;
          break;
        }
      }

      if (headerRowIdx === -1) {
        alert('無法辨識此清冊格式，找不到「財產編號」表頭列。');
        return;
      }

      const headers = rawJson[headerRowIdx].map(h => String(h).trim().replace(/\r?\n/g, ''));
      let importedCount = 0;
      let mergedCount = 0;
      const batchUpdates = {};

      for (let r = headerRowIdx + 1; r < rawJson.length; r++) {
        const row = rawJson[r];
        if (!row || row.length === 0) continue;

        let item = {};
        headers.forEach((h, idx) => {
          item[h] = row[idx] !== undefined ? String(row[idx]).trim() : '';
        });

        const rawPropId = item['財產編號'] || '';
        const propName = item['財產名稱'] || '';
        if (!rawPropId || !propName || rawPropId.includes('保管人') || rawPropId.includes('說明：') || rawPropId.includes('第 一 聯')) {
          continue;
        }

        // 拆解雙行財產編號
        const idParts = rawPropId.split(/\r?\n+/).map(s => s.trim()).filter(Boolean);
        let categoryCode = '';
        let assetNo = '';
        if (idParts.length >= 2) {
          categoryCode = idParts[0];
          assetNo = idParts[1];
        } else {
          assetNo = idParts[0];
        }

        const rawKey = assetNo || categoryCode;
        if (!rawKey) continue;
        const assetKey = rawKey.replace(/[.$#\[\]\/]/g, '_');

        // 拆解保管人代號與姓名
        const rawCustodian = item['保管人員'] || '';
        const custodianParts = rawCustodian.split(/\r?\n+/).map(s => s.trim()).filter(Boolean);
        const custodianCode = custodianParts.length > 1 ? custodianParts[0] : '';
        const custodian = custodianParts.length > 1 ? custodianParts[1] : (custodianParts[0] || '');

        const spec = (item['形式品名'] || item['形式/品名'] || '').replace(/\r?\n+/g, ' ').trim();

        // 智慧合併：若雲端已有此財產，保留已異動之地點、保管人、狀態、備註與盤點紀錄
        const existing = assetsMap.get(assetKey);
        let assetObj = {
          assetKey: assetKey,
          assetNo: assetNo,
          categoryCode: categoryCode,
          oldNo: item['舊登錄號'] || '',
          name: propName,
          spec: spec,
          unit: item['單位'] || '',
          qty: item['數量'] || '1',
          price: item['總價'] || '',
          purchaseDate: item['購置日期'] || '',
          lifespan: item['使用年限'] || '',
          usedYears: item['已使用年限'] || '',
          entryDate: item['入帳日期'] || '',
          dept: item['領用單位'] || '',
          reserveValue: item['預留殘值'] || '0',
          location: existing ? existing.location : (item['存放地點'] || '未設定'),
          custodian: existing ? existing.custodian : custodian,
          custodianCode: existing && existing.custodianCode ? existing.custodianCode : custodianCode,
          status: existing ? existing.status : 'in_use',
          scrapReason: existing ? existing.scrapReason : '',
          notes: existing ? existing.notes : (item['備註'] || ''),
          checked: existing ? existing.checked : false,
          checkedTime: existing ? existing.checkedTime : '',
          history: existing && existing.history ? existing.history : [
            { time: new Date().toLocaleString(), action: '清冊匯入建檔', note: '原始 Excel 匯入' }
          ]
        };

        if (existing) mergedCount++;
        else importedCount++;

        assetsMap.set(assetKey, assetObj);
        if (assetObj.location) locationsSet.add(assetObj.location);
        batchUpdates[assetKey] = assetObj;
        saveToIDB(assetObj);
      }

      // 一次批次同步至 Firebase
      await firebaseDb.ref('assets').update(batchUpdates);

      updateLocationSelects();
      renderTable();
      updateStats();
      alert(`Excel 匯入並同步雲端完成！\n新增設備: ${importedCount} 筆\n智慧合併更新: ${mergedCount} 筆`);
    } catch (err) {
      console.error(err);
      alert('解析 Excel 失敗：' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
  e.target.value = '';
}

// 渲染設備列表
function renderTable() {
  const search = document.getElementById('searchInput').value.trim().toLowerCase();
  const filterLoc = document.getElementById('filterLocation').value;
  const filterStat = document.getElementById('filterStatus').value;
  const filterChk = document.getElementById('filterChecked').value;

  const tbody = document.getElementById('assetTableBody');
  tbody.innerHTML = '';

  let filtered = Array.from(assetsMap.values()).filter(a => {
    if (filterLoc && a.location !== filterLoc) return false;
    if (filterStat && a.status !== filterStat) return false;
    if (filterChk === 'checked' && !a.checked) return false;
    if (filterChk === 'unchecked' && a.checked) return false;
    if (search) {
      const text = `${a.assetKey} ${a.assetNo} ${a.categoryCode} ${a.oldNo} ${a.name} ${a.spec} ${a.location} ${a.custodian} ${a.notes}`.toLowerCase();
      return text.includes(search);
    }
    return true;
  });

  if (filtered.length === 0) {
    tbody.innerHTML = `<tr><td colspan="7" class="text-center py-4 text-muted">無符合篩選條件的財產設備</td></tr>`;
    return;
  }

  filtered.sort((a, b) => (a.checked === b.checked ? String(a.assetKey).localeCompare(String(b.assetKey)) : a.checked ? 1 : -1));

  const fragment = document.createDocumentFragment();
  filtered.forEach(item => {
    const tr = document.createElement('tr');
    tr.className = item.checked ? 'table-success-subtle' : '';

    let statusBadge = '<span class="badge badge-status-in_use">正常在用</span>';
    if (item.status === 'pending_scrap') statusBadge = '<span class="badge badge-status-pending_scrap">擬報廢</span>';
    if (item.status === 'scrapped') statusBadge = '<span class="badge badge-status-scrapped">已報廢</span>';

    tr.innerHTML = `
      <td>
        <input class="form-check-input" type="checkbox" ${item.checked ? 'checked' : ''} onchange="toggleItemChecked('${item.assetKey}', this.checked)">
      </td>
      <td>
        <div class="fw-bold text-primary font-monospace">${item.assetNo || item.assetKey}</div>
        <div class="small text-muted font-monospace">${item.categoryCode || ''}</div>
      </td>
      <td>
        <div class="fw-bold">${item.name}</div>
        <div class="small text-muted text-truncate" style="max-width: 280px;" title="${item.spec}">${item.spec}</div>
        ${item.notes ? `<div class="small text-info-emphasis"><i class="bi bi-sticky me-1"></i>${item.notes}</div>` : ''}
      </td>
      <td><span class="badge bg-light text-dark border">${item.location || '未設定'}</span></td>
      <td>${item.custodian || '-'}</td>
      <td>${statusBadge}</td>
      <td class="text-end">
        <button class="btn btn-sm btn-outline-primary" onclick="openDetailModal('${item.assetKey}')">
          <i class="bi bi-pencil-square"></i> 異動
        </button>
      </td>
    `;
    fragment.appendChild(tr);
  });
  tbody.appendChild(fragment);
}

function updateStats() {
  const total = assetsMap.size;
  let checked = 0;
  let pendingScrap = 0;
  assetsMap.forEach(a => {
    if (a.checked) checked++;
    if (a.status === 'pending_scrap') pendingScrap++;
  });
  document.getElementById('statTotal').innerText = total;
  document.getElementById('statChecked').innerText = checked;
  document.getElementById('statUnchecked').innerText = total - checked;
  document.getElementById('statPendingScrap').innerText = pendingScrap;
}

function updateLocationSelects() {
  const select = document.getElementById('filterLocation');
  const currentVal = select.value;
  const datalist = document.getElementById('locationOptions');
  select.innerHTML = '<option value="">全部存放地點</option>';
  datalist.innerHTML = '';
  Array.from(locationsSet).sort().forEach(loc => {
    if (!loc) return;
    const opt = document.createElement('option');
    opt.value = loc;
    opt.textContent = loc;
    select.appendChild(opt);

    const dOpt = document.createElement('option');
    dOpt.value = loc;
    datalist.appendChild(dOpt);
  });
  select.value = currentVal;
}

function clearSearch() {
  document.getElementById('searchInput').value = '';
  renderTable();
}

function toggleItemChecked(key, isChecked) {
  const asset = assetsMap.get(key);
  if (!asset) return;
  asset.checked = isChecked;
  asset.checkedTime = isChecked ? new Date().toLocaleString() : '';
  saveAsset(asset);
  updateStats();
  renderTable();
}

// 詳情與異動 Modal
function openDetailModal(key) {
  const asset = assetsMap.get(key);
  if (!asset) return;

  document.getElementById('editAssetKey').value = asset.assetKey;
  document.getElementById('editName').value = asset.name;
  document.getElementById('editAssetNo').value = `${asset.assetNo} (${asset.categoryCode || ''})`;
  document.getElementById('editSpec').value = asset.spec;
  document.getElementById('editLocation').value = asset.location || '';
  document.getElementById('editCustodian').value = asset.custodian || '';
  document.getElementById('editStatus').value = asset.status || 'in_use';
  document.getElementById('editScrapReason').value = asset.scrapReason || '';
  document.getElementById('editNotes').value = asset.notes || '';
  
  document.getElementById('viewPurchaseDate').innerText = asset.purchaseDate || '-';
  document.getElementById('viewLifespan').innerText = asset.lifespan || '-';
  document.getElementById('viewUsedYears').innerText = asset.usedYears || '-';
  document.getElementById('viewPrice').innerText = asset.price ? Number(asset.price).toLocaleString() : '-';
  document.getElementById('viewOldNo').innerText = asset.oldNo || '-';

  const chkBadge = document.getElementById('viewCheckedBadge');
  const btnChk = document.getElementById('btnToggleCheck');
  if (asset.checked) {
    chkBadge.className = 'badge bg-success';
    chkBadge.innerText = `已盤點 (${asset.checkedTime || ''})`;
    btnChk.className = 'btn btn-outline-danger';
    btnChk.innerHTML = '<i class="bi bi-x-circle me-1"></i>取消已盤點標記';
  } else {
    chkBadge.className = 'badge bg-secondary';
    chkBadge.innerText = '未盤點';
    btnChk.className = 'btn btn-outline-success';
    btnChk.innerHTML = '<i class="bi bi-check2-circle me-1"></i>標記為已盤點';
  }

  handleStatusChange();
  renderTimeline(asset.history || []);

  const modalEl = document.getElementById('assetDetailModal');
  const modal = bootstrap.Modal.getOrCreateInstance(modalEl);
  modal.show();
}

function handleStatusChange() {
  const stat = document.getElementById('editStatus').value;
  document.getElementById('scrapReasonBox').style.display = (stat === 'pending_scrap' || stat === 'scrapped') ? 'block' : 'none';
}

function renderTimeline(history) {
  const container = document.getElementById('historyTimeline');
  container.innerHTML = '';
  if (!history || history.length === 0) {
    container.innerHTML = '<div class="text-muted small">尚無異動歷程</div>';
    return;
  }
  history.slice().reverse().forEach(h => {
    const item = document.createElement('div');
    item.className = 'timeline-item';
    item.innerHTML = `
      <div class="fw-bold small text-dark">${h.action} <span class="text-muted fw-normal">(${h.time})</span></div>
      <div class="small text-secondary">${h.note || ''}</div>
    `;
    container.appendChild(item);
  });
}

function toggleCurrentAssetChecked() {
  const key = document.getElementById('editAssetKey').value;
  const asset = assetsMap.get(key);
  if (!asset) return;
  asset.checked = !asset.checked;
  asset.checkedTime = asset.checked ? new Date().toLocaleString() : '';
  saveAsset(asset);
  updateStats();
  renderTable();
  openDetailModal(key);
}

function saveAssetDetail() {
  const key = document.getElementById('editAssetKey').value;
  const asset = assetsMap.get(key);
  if (!asset) return;

  const newLoc = document.getElementById('editLocation').value.trim();
  const newCus = document.getElementById('editCustodian').value.trim();
  const newStat = document.getElementById('editStatus').value;
  const newReason = document.getElementById('editScrapReason').value.trim();
  const newNotes = document.getElementById('editNotes').value.trim();

  let logs = [];
  const now = new Date().toLocaleString();

  if (asset.location !== newLoc) {
    logs.push(`地點移轉: [${asset.location || '未設定'}] ➔ [${newLoc}]`);
    asset.location = newLoc;
    if (newLoc) locationsSet.add(newLoc);
  }
  if (asset.custodian !== newCus) {
    logs.push(`保管人移轉: [${asset.custodian || '-'}] ➔ [${newCus}]`);
    asset.custodian = newCus;
  }
  if (asset.status !== newStat || asset.scrapReason !== newReason) {
    logs.push(`狀態變更: [${asset.status}] ➔ [${newStat}] ${newReason ? '(原因: ' + newReason + ')' : ''}`);
    asset.status = newStat;
    asset.scrapReason = newReason;
  }
  if (asset.notes !== newNotes) {
    logs.push(`更新備註: ${newNotes}`);
    asset.notes = newNotes;
  }

  if (logs.length > 0) {
    if (!asset.history) asset.history = [];
    logs.forEach(msg => {
      asset.history.push({ time: now, action: '設備異動', note: msg });
    });
    saveAsset(asset);
    updateLocationSelects();
    updateStats();
    renderTable();
  }

  bootstrap.Modal.getInstance(document.getElementById('assetDetailModal')).hide();
}

// 音效與震動回饋
function playBeep(freq = 880, duration = 0.12) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    gain.gain.setValueAtTime(0.18, ctx.currentTime);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + duration);
  } catch (e) {}
}

function triggerVibration() {
  if ('vibrate' in navigator) {
    navigator.vibrate([120]);
  }
}

// 行動端相機連續掃描
function openScannerModal() {
  const modal = new bootstrap.Modal(document.getElementById('scannerModal'));
  modal.show();
  scanSuccessCount = 0;
  document.getElementById('scanCounterText').innerText = '本次掃描成功: 0 件';
  startScanner();
}

function closeScannerModal() {
  stopScanner();
  const modalInstance = bootstrap.Modal.getInstance(document.getElementById('scannerModal'));
  if (modalInstance) modalInstance.hide();
  renderTable();
  updateStats();
}

function startScanner() {
  const qrBoxFunction = (viewfinderWidth, viewfinderHeight) => {
    return { width: Math.floor(viewfinderWidth * 0.85), height: 110 };
  };

  html5QrCode = new Html5Qrcode("reader");
  const config = {
    fps: 15,
    qrbox: qrBoxFunction,
    formatsToSupport: [
      Html5QrcodeSupportedFormats.CODE_39,
      Html5QrcodeSupportedFormats.CODE_128,
      Html5QrcodeSupportedFormats.QR_CODE
    ]
  };

  html5QrCode.start(
    { facingMode: "environment" },
    config,
    onBarcodeScanned,
    () => {}
  ).catch(err => {
    alert("無法啟動相機：請確認透過 HTTPS 安全網址開啟並允許相機權限。\n" + err);
  });
}

function stopScanner() {
  if (html5QrCode) {
    html5QrCode.stop().then(() => {
      html5QrCode.clear();
      html5QrCode = null;
    }).catch(e => console.log(e));
  }
}

function toggleTorch() {
  if (html5QrCode) {
    isTorchOn = !isTorchOn;
    html5QrCode.applyVideoConstraints({
      advanced: [{ torch: isTorchOn }]
    }).catch(() => alert("此裝置或瀏覽器不支援手電筒補光控制"));
  }
}

function onBarcodeScanned(decodedText) {
  const cleanCode = decodedText.trim();

  if (cleanCode === lastScannedCode) return;
  lastScannedCode = cleanCode;
  clearTimeout(scanCooldownTimer);
  scanCooldownTimer = setTimeout(() => { lastScannedCode = ''; }, 2500);

  let found = assetsMap.get(cleanCode);
  if (!found) {
    for (let item of assetsMap.values()) {
      if (item.assetNo === cleanCode || item.assetKey.endsWith(cleanCode) || item.oldNo === cleanCode) {
        found = item;
        break;
      }
    }
  }

  const feedback = document.getElementById('scanFeedback');
  if (found) {
    playBeep(987, 0.15);
    triggerVibration();
    
    found.checked = true;
    found.checkedTime = new Date().toLocaleString();
    if (!found.history) found.history = [];
    found.history.push({ time: found.checkedTime, action: '相機掃碼盤點', note: '現場確認在用正常' });
    saveAsset(found);
    
    scanSuccessCount++;
    document.getElementById('scanCounterText').innerText = `本次掃描成功: ${scanSuccessCount} 件`;

    feedback.className = "mt-2 p-2 rounded text-start text-white bg-success small";
    feedback.innerHTML = `
      <div class="fw-bold fs-6"><i class="bi bi-check-circle-fill me-1"></i> [${found.assetNo || found.assetKey}] ${found.name}</div>
      <div>地點: <strong>${found.location}</strong> | 保管人: <strong>${found.custodian}</strong></div>
      <div class="mt-1 d-flex justify-content-end">
        <button class="btn btn-sm btn-light py-0 px-2 fw-bold" onclick="openDetailModal('${found.assetKey}')">異動此設備</button>
      </div>
    `;
    updateStats();
  } else {
    playBeep(320, 0.25);
    feedback.className = "mt-2 p-2 rounded text-start text-white bg-danger small";
    feedback.innerHTML = `<i class="bi bi-exclamation-triangle-fill me-1"></i> 條碼 [${cleanCode}] 查無對應設備！請確認是否已匯入清冊。`;
  }
}

// 匯出包含最新狀態的 Excel 清冊
function exportUpdatedExcel() {
  if (assetsMap.size === 0) {
    alert('目前尚無資料可供匯出。');
    return;
  }

  const exportData = [];
  assetsMap.forEach(item => {
    let statText = '正常在用';
    if (item.status === 'pending_scrap') statText = '擬報廢';
    if (item.status === 'scrapped') statText = '已報廢';

    exportData.push({
      '財產編號': item.categoryCode ? `${item.categoryCode}\r\n\r\n${item.assetNo}` : item.assetNo,
      '舊登錄號': item.oldNo,
      '財產名稱': item.name,
      '形式\n品名': item.spec,
      '單位': item.unit,
      '數量': item.qty,
      '總價': item.price,
      '購置日期': item.purchaseDate,
      '使用年限': item.lifespan,
      '已使用年限': item.usedYears,
      '存放地點': item.location,
      '保管人員': item.custodianCode ? `${item.custodianCode}\r\n${item.custodian}` : item.custodian,
      '備註': item.notes,
      '［系統］盤點狀態': item.checked ? '已盤點' : '未盤點',
      '［系統］盤點時間': item.checkedTime || '',
      '［系統］設備狀態': statText,
      '［系統］報廢原因': item.scrapReason || ''
    });
  });

  const ws = XLSX.utils.json_to_sheet(exportData);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "盤點最新清冊");
  const fileName = `財產盤點最新清冊_${new Date().toISOString().slice(0,10)}.xlsx`;
  XLSX.writeFile(wb, fileName);
}

function clearAllData() {
  if (confirm('確定要清空雲端與本機的所有財產與盤點紀錄嗎？此動作無法復原！')) {
    assetsMap.clear();
    locationsSet.clear();
    if (db) {
      const tx = db.transaction('assets', 'readwrite');
      tx.objectStore('assets').clear();
    }
    firebaseDb.ref('assets').remove();
    renderTable();
    updateStats();
    alert('資料庫已全數清空。');
  }
}

window.addEventListener('DOMContentLoaded', initSystem);
